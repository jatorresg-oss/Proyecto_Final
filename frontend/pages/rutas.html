<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogiTrans Express | Rutas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">LT</span>
      <span>LogiTrans Express</span>
      <nav class="topnav" aria-label="Navegación principal">
        <a href="dashboard.html">Panel</a>
        <a href="conductores.html">Conductores</a>
        <a href="vehiculos.html">Vehículos</a>
        <a href="rutas.html" class="active">Rutas</a>
      </nav>
    </div>
    <div class="topbar-user">
      <span id="userName">—</span>
      <button id="logoutBtn" type="button" class="btn-ghost">Cerrar sesión</button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Rutas</h1>
        <p class="muted">Corredores, distancias y tiempos estimados de entrega.</p>
      </div>
      <div class="filter-actions">
        <button id="tiemposBtn" type="button" class="btn-small btn-ghost">Ver tiempos estimados</button>
        <button id="nuevoBtn" type="button" class="btn-small btn-primary">+ Nueva ruta</button>
      </div>
    </div>

    <p id="pageMessage" class="message" role="status" aria-live="polite"></p>

    <section class="card" aria-labelledby="filtrosTitulo">
      <h2 id="filtrosTitulo">Buscar rutas</h2>
      <form id="filtrosForm" class="filter-bar" novalidate>
        <div>
          <label for="filtroCiudad">Ciudad (origen o destino)</label>
          <input id="filtroCiudad" name="ciudad" type="text" maxlength="100" placeholder="Ej. Bogotá" />
        </div>
        <div>
          <label for="filtroOrigen">Origen</label>
          <input id="filtroOrigen" name="origen" type="text" maxlength="100" placeholder="Ej. Medellín" />
        </div>
        <div>
          <label for="filtroDestino">Destino</label>
          <input id="filtroDestino" name="destino" type="text" maxlength="100" placeholder="Ej. Cali" />
        </div>
        <div>
          <label for="filtroTiempo">Tiempo estimado</label>
          <input id="filtroTiempo" name="tiempo" type="text" maxlength="50" placeholder="Ej. horas" />
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn-small btn-primary">Buscar</button>
          <button id="limpiarFiltros" type="button" class="btn-small btn-ghost">Limpiar</button>
        </div>
      </form>
    </section>

    <section id="tiemposPanel" class="card" hidden aria-labelledby="tiemposTitulo">
      <h2 id="tiemposTitulo">Tiempos estimados</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Origen</th>
              <th>Destino</th>
              <th>Tiempo estimado</th>
            </tr>
          </thead>
          <tbody id="tiemposBody"></tbody>
        </table>
      </div>
    </section>

    <section class="table-wrapper" aria-label="Listado de rutas">
      <table>
        <thead>
          <tr>
            <th>Origen</th>
            <th>Destino</th>
            <th>Distancia (km)</th>
            <th>Tiempo estimado</th>
            <th>Observaciones</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rutasBody">
          <tr><td colspan="6" class="empty">Cargando rutas…</td></tr>
        </tbody>
      </table>
    </section>

    <section id="formPanel" class="card form-panel" hidden aria-labelledby="formTitulo">
      <h2 id="formTitulo">Nueva ruta</h2>
      <p id="formMessage" class="message" role="status" aria-live="polite"></p>

      <form id="rutaForm" novalidate>
        <input id="rutaId" type="hidden" />

        <div class="form-grid">
          <div>
            <label for="ciudad_origen">Ciudad de origen</label>
            <input id="ciudad_origen" name="ciudad_origen" type="text" maxlength="100" required />
          </div>
          <div>
            <label for="ciudad_destino">Ciudad de destino</label>
            <input id="ciudad_destino" name="ciudad_destino" type="text" maxlength="100" required />
          </div>
          <div>
            <label for="distancia">Distancia (km)</label>
            <input id="distancia" name="distancia" type="number" min="0.01" step="0.01" required />
          </div>
          <div>
            <label for="tiempo_estimado">Tiempo estimado</label>
            <input id="tiempo_estimado" name="tiempo_estimado" type="text" maxlength="50" required />
          </div>
          <div class="campo-completo">
            <label for="observaciones">Observaciones (opcional)</label>
            <textarea id="observaciones" name="observaciones" rows="2"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button id="guardarBtn" type="submit" class="btn-small btn-primary">Guardar ruta</button>
          <button id="cancelarBtn" type="button" class="btn-small btn-ghost">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/rutas.js"></script>
</body>
</html>
